name: Build
# The tools and tests, built the way setup builds them, on Windows (MSVC,
# setup's default and HOTDVR.exe's compiler): the machine the Quest app is built on. No ROM set: the
# game itself is not recompiled here.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows only: where the Quest app is built (the recompiler and the desktop tools it needs)
        include:
          - {name: windows-msvc, os: windows-2022, compiler: msvc}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup regression tests
        run: python -m unittest discover -s tests/scripts -p test_setup.py -v
      # The runners have no winget, so setup.ps1 cannot run here; check it parses.
      - name: setup.ps1 parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: Setup (Windows)
        if: runner.os == 'Windows'
        env:
          M2_COMPILER: ${{ matrix.compiler }}
        run: python scripts/setup.py
      - name: Tests
        run: ctest --test-dir build_houseofthedead/pc/hotd -C Release --output-on-failure
