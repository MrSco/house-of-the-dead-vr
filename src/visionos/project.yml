# House of the Dead VR for Apple Vision Pro: the xcodegen project (scripts/build_visionos.py makes and builds it on the
# Mac; docs/platforms.md, P5).
#
# CMake builds everything into static libraries in build_visionos/<slice> (cmake/visionos.cmake), merged into
# libhotdvr_all.a; this is the app around them: the SwiftUI entry (VosApp.swift) and the Sense controllers' Swift,
# Info.plist, the Quest's models and voice lines (src/quest/assets, as the bundle's assets folder), ANGLE's
# frameworks, Apple's frameworks and the signing. Generated, never edited: src/visionos/HouseOfTheDeadVR.xcodeproj is
# git-ignored.
#
# From the environment (build_visionos.py sets them):
#   HOTD_ANGLE_FW      build_visionos/angle: ANGLE's xcframeworks (from ~/angle) without their debug maps (the paths of the
#                      machine that built them: scripts/build_info.py clean_angle)
#   HOTD_LIBS          build_visionos (the libraries: build_visionos/simulator, build_visionos/device)
#   HOTD_VERSION       0.7.0 (the Quest app's versionName)
#   HOTD_BUILD         12 (its versionCode, or --archive's build)
#   HOTD_BUNDLE_ID     com.mrsco.hotdvr unless set
#   DEVELOPMENT_TEAM   your Apple team id, for a signed device build
name: HouseOfTheDeadVR
options:
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    XROS_DEPLOYMENT_TARGET: "26.0"
    CLANG_ENABLE_OBJC_ARC: "YES"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ENABLE_DEBUG_DYLIB: "NO"
    # the app stripped in every build, as an archive is (its dSYM made first, for the crash reports): no debug map,
    # whose object paths are the build machine's (scripts/check_paths.py)
    DEPLOYMENT_POSTPROCESSING: "YES"
    SWIFT_VERSION: "5.0"
    # arm64 only: the libraries (and ANGLE) have no Intel simulator slice
    EXCLUDED_ARCHS[sdk=xrsimulator*]: x86_64
    HOTD_SLICE: device
    HOTD_SLICE[sdk=xrsimulator*]: simulator
    LIBRARY_SEARCH_PATHS:
      - "${HOTD_LIBS}/$(HOTD_SLICE)"
targets:
  HouseOfTheDeadVR:
    type: application
    platform: visionOS
    sources:
      - path: VosApp.swift
      - path: VosControllers.swift
      - path: PrivacyInfo.xcprivacy
      # the round layered icon (scripts/make_icons.py visionos)
      - path: Assets.xcassets
      # the guns, the hands, the cabinet and the reload lines (xr_vos.m's qasset_open)
      - path: ../quest/assets
        type: folder
        buildPhase: resources
    settings:
      base:
        SDKROOT: xros
        SUPPORTED_PLATFORMS: "xros xrsimulator"
        TARGETED_DEVICE_FAMILY: "7"
        PRODUCT_BUNDLE_IDENTIFIER: "${HOTD_BUNDLE_ID}"
        PRODUCT_NAME: HouseOfTheDeadVR
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: vos_bridging.h
        MARKETING_VERSION: "${HOTD_VERSION}"
        CURRENT_PROJECT_VERSION: "${HOTD_BUILD}"
        OTHER_LDFLAGS: "-ObjC -lhotdvr_all -lc++ -lobjc"
    dependencies:
      # ANGLE supplies every gl* and egl* call (its visionOS slices)
      - framework: "${HOTD_ANGLE_FW}/libGLESv2.xcframework"
        embed: true
        codeSign: true
      - framework: "${HOTD_ANGLE_FW}/libEGL.xcframework"
        embed: true
        codeSign: true
      - sdk: CompositorServices.framework
      - sdk: ARKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreHaptics.framework
      - sdk: GameController.framework
      - sdk: Foundation.framework
      - sdk: CoreFoundation.framework
      - sdk: UniformTypeIdentifiers.framework
