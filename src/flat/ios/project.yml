# House of the Dead VR for iPhone and iPad: the xcodegen project (scripts/build_apple.py makes and builds it on the Mac).
#
# CMake builds everything into static libraries in build_ios/<slice> (cmake/flat_apple.cmake), merged into
# libhotdvr_all.a; this is only the app
# around them: Info.plist, ANGLE's frameworks, Apple's frameworks and the signing. Generated, never edited:
# src/flat/ios/HouseOfTheDeadVR.xcodeproj is git-ignored. As GoldenEye VR's port/ios/project.yml.
#
# From the environment (build_apple.py sets them):
#   ANGLE_DIR          ANGLE's one place on the Mac (~/angle), its xcframeworks
#   HOTD_LIBS          build_ios (the libraries: build_ios/simulator, build_ios/device)
#   HOTD_VERSION       0.4.1 (the Quest app's versionName)
#   HOTD_BUILD         7 (its versionCode)
#   DEVELOPMENT_TEAM   your Apple team id, for a signed device build (SideStore re-signs an unsigned one)
name: HouseOfTheDeadVR
options:
  bundleIdPrefix: com.mrsco
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CLANG_ENABLE_OBJC_ARC: "YES"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ENABLE_DEBUG_DYLIB: "NO"
    # arm64 only: the libraries (and ANGLE) have no Intel simulator slice
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    HOTD_SLICE: device
    HOTD_SLICE[sdk=iphonesimulator*]: simulator
    LIBRARY_SEARCH_PATHS:
      - "${HOTD_LIBS}/$(HOTD_SLICE)"
targets:
  HouseOfTheDeadVR:
    type: application
    platform: iOS
    sources:
      # the app's one source of its own: main() is the libraries' (src/flat/ios/main_ios.m)
      - path: stub.c
    settings:
      base:
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.mrsco.hotdvr
        PRODUCT_NAME: HouseOfTheDeadVR
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "${HOTD_VERSION}"
        CURRENT_PROJECT_VERSION: "${HOTD_BUILD}"
        # -ObjC: the app and scene delegates are only named at run time, so without it the linker drops them
        # (build_apple.py merges every library CMake made into libhotdvr_all.a)
        # (and the Objective-C runtime and Foundation: the target's own source is C, so Xcode adds neither itself)
        OTHER_LDFLAGS: "-ObjC -lhotdvr_all -lc++ -lobjc"
    dependencies:
      # ANGLE supplies every gl* and egl* call
      - framework: "${ANGLE_DIR}/xcframeworks/libGLESv2.xcframework"
        embed: true
        codeSign: true
      - framework: "${ANGLE_DIR}/xcframeworks/libEGL.xcframework"
        embed: true
        codeSign: true
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: GameController.framework
      - sdk: CoreMotion.framework
      - sdk: UniformTypeIdentifiers.framework
